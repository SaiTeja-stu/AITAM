plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cybershield.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cybershield.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Default backend URL. Overridable in-app (Auth screen -> "Server" line).
        //  - phone on same Wi-Fi : your PC's LAN IP, e.g. http://10.10.84.80:8899/
        //  - emulator            : http://10.0.2.2:8899/
        //  - USB (adb reverse)   : http://127.0.0.1:8899/
        buildConfigField "String", "API_BASE_URL",
                "\"" + (project.findProperty("apiBaseUrl") ?: "http://10.10.84.80:8899/") + "\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.core:core:1.13.1'

    // Fingerprint / face / device-credential unlock
    implementation 'androidx.biometric:biometric:1.1.0'
    // Encrypted token storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Local DB (scan history + on-device blocklist)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Camera + on-device QR / barcode decoding
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    implementation 'com.google.code.gson:gson:2.11.0'

    // On-device detection engine (ported from the backend)
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.apache.commons:commons-text:1.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

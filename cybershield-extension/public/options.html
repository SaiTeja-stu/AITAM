<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cyber Shield — Settings</title>
    <style>
      :root { color-scheme: dark; }
      body { max-width: 420px; margin: 40px auto; padding: 0 16px;
             font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
             background: #0b1020; color: #e7ecf5; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; color: #93a0bc; font-size: 13px; }
      input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #243050;
              background: #131a2e; color: #e7ecf5; }
      button { margin-top: 16px; padding: 8px 14px; border-radius: 8px; border: 0;
               background: #38bdf8; color: #0b1020; font-weight: 600; cursor: pointer; }
      button.secondary { background: #1b2540; color: #e7ecf5; border: 1px solid #243050; }
      .status { margin-top: 12px; font-size: 13px; }
      .ok { color: #34d399; } .err { color: #f87171; }
      .muted { color: #93a0bc; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Cyber Shield settings</h1>

    <label for="baseUrl">Backend URL</label>
    <input id="baseUrl" placeholder="http://localhost:8899" />
    <button id="saveUrl" class="secondary">Save URL</button>

    <hr style="border-color:#243050; margin:24px 0;" />

    <label for="username">Username</label>
    <input id="username" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div>
      <button id="login">Sign in</button>
      <button id="logout" class="secondary">Sign out</button>
    </div>

    <p id="status" class="status"></p>
    <p class="muted">The token is stored locally in this browser and sent as a Bearer header to your backend only.</p>

    <script type="module" src="options.js"></script>
  </body>
</html>

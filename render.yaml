# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: cybershield-backend
    runtime: docker
    dockerfilePath: ./cybershield-backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: CYBERSHIELD_JWT_SECRET
        generateValue: true
      - key: CYBERSHIELD_HMAC_SECRET
        generateValue: true
      - key: CYBERSHIELD_ADMIN_USER
        value: admin
      - key: CYBERSHIELD_ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: CYBERSHIELD_MAIL_ENABLED
        value: "true"        # sends through Brevo's HTTPS API (Render blocks SMTP on the free tier)
      - key: BREVO_API_KEY
        sync: false          # paste your Brevo API key in the Render dashboard
      - key: MAIL_FROM
        sync: false          # a sender address you verified in Brevo (e.g. your Gmail)
      - key: CYBERSHIELD_REQUIRE_EMAIL_VERIFICATION
        value: "true"        # email works now (Brevo), so verify addresses with a 6-digit code
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"       # otherwise /actuator/health reports DOWN (no SMTP) and Render kills the deploy
